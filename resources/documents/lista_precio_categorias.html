<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA DE PRECIOS POR CATEGORÍA - DISTRIBUIDORA VERTI-MAR</title>
    <style>
        @page {
            size: A4;
            margin: 8mm 6mm 8mm 6mm;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-size: 11px;
            line-height: 1.3;
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            color-adjust: exact;
        }

        .container {
            width: 100%;
            max-width: 190mm;
            margin: 0 auto;
            padding: 8px;
            border: 1px solid #000;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
            page-break-after: avoid;
        }

        .header2 {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
            margin-top: 10px;
            page-break-after: avoid;
        }

        .header3 {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
            page-break-after: avoid;
        }

        .info {
            font-size: 10px;
            line-height: 1.4;
            border-bottom: 1px solid #000;
            padding-bottom: 6px;
            margin-bottom: 10px;
            page-break-inside: avoid;
        }

        .info p {
            margin: 2px 0;
        }

        .categoria-titulo {
            font-size: 13px;
            font-weight: bold;
            background-color: #e0e0e0;
            padding: 6px 10px;
            margin-top: 12px;
            margin-bottom: 6px;
            border: 1px solid #333;
            page-break-after: avoid;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            font-size: 10px;
            page-break-inside: auto;
        }

        .table th, .table td {
            border: 1px solid #ccc;
            padding: 4px 6px;
            text-align: left;
            word-wrap: break-word;
            line-height: 1.2;
        }

        .table th {
            background-color: #f5f5f5;
            font-weight: bold;
            font-size: 10px;
            page-break-after: avoid;
        }

        .table tr {
            page-break-inside: avoid;
            page-break-after: auto;
        }

        /* Anchos de columnas */
        .table th:nth-child(1), .table td:nth-child(1) { width: 15%; text-align: center; }  /* Código */
        .table th:nth-child(2), .table td:nth-child(2) { width: 50%; }                      /* Nombre */
        .table th:nth-child(3), .table td:nth-child(3) { width: 15%; text-align: center; }  /* Unidad */
        .table th:nth-child(4), .table td:nth-child(4) { width: 20%; text-align: right; }   /* Precio */

        .footer {
            margin-top: 15px;
            text-align: center;
            font-style: italic;
            font-size: 9px;
            color: #555;
            page-break-inside: avoid;
        }

        .footer p {
            margin: 2px 0;
        }

        /* Utilidades para manejo de páginas */
        .page-break-before { page-break-before: always; }
        .page-break-after { page-break-after: always; }
        .no-page-break { page-break-inside: avoid; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">DISTRIBUIDORA VERTI-MAR SRL</div>
        <div class="header2">LISTA DE PRECIOS</div>
        <div class="header3">DOCUMENTO NO VÁLIDO COMO FACTURA</div>

        <div class="info no-page-break">
            <p><strong>Fecha:</strong> {{fecha}}</p>
            
        </div>

        {{categorias}}

        <div class="footer no-page-break">
            
            <p>Todos los precios incluyen IVA (21%)</p>
            <p>Precios sujetos a modificación sin previo aviso</p>
        </div>
    </div>
</body>
</html>
